<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Merge Tower Defense</title>
  <link rel="icon" href="data:,">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0e1019;
      color: #e8eaf1;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    #app {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      align-items: flex-start;
      justify-content: center;
      padding: 20px;
    }
    /* HUD (React) and game canvas (PixiJS) live in separate roots. */
    #hud-root { width: 250px; }
    #game-root canvas {
      display: block;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
      touch-action: none;
    }
    .hud {
      background: #181c2c;
      border: 1px solid #262b42;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .hud-title { font-size: 17px; margin: 0; letter-spacing: 0.3px; }
    .hud-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .hud-mute {
      appearance: none;
      border: 1px solid #2f3450;
      border-radius: 6px;
      background: #1f2438;
      color: #9aa3c0;
      padding: 4px 8px;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
    }
    .hud-mute:hover { filter: brightness(1.2); }
    .hud-stats { display: flex; flex-direction: column; gap: 6px; }
    .hud-stat {
      display: flex;
      justify-content: space-between;
      background: #1f2438;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 14px;
    }
    .hud-stat-label { color: #9aa3c0; }
    .hud-stat-value { font-weight: 600; font-variant-numeric: tabular-nums; }
    .hud-stat-danger {
      background: #3a1520;
      animation: hud-pulse 1s ease-in-out infinite;
    }
    .hud-stat-danger .hud-stat-label,
    .hud-stat-danger .hud-stat-value { color: #ff8a80; }
    @keyframes hud-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239, 83, 80, 0.35); }
      50% { box-shadow: 0 0 0 4px rgba(239, 83, 80, 0); }
    }
    .hud-shop { display: flex; flex-direction: column; gap: 8px; }
    .hud-buy {
      appearance: none;
      border: 0;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13.5px;
      font-weight: 600;
      color: #10131f;
      cursor: pointer;
      transition: filter 120ms ease;
    }
    .hud-buy-archer { background: #66bb6a; }
    .hud-buy-cannon { background: #ffa726; }
    .hud-buy-frost  { background: #4fc3f7; }
    .hud-buy:hover:not(:disabled) { filter: brightness(1.12); }
    .hud-buy:disabled { background: #3a4059; color: #8b91ac; cursor: not-allowed; }
    .hud-gameover {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #3a1520;
      border: 1px solid #7c2d3d;
      border-radius: 8px;
      padding: 12px;
      font-size: 13px;
      color: #ffb4c0;
    }
    .hud-restart {
      appearance: none;
      border: 0;
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 13.5px;
      font-weight: 600;
      color: #10131f;
      background: #ef5350;
      cursor: pointer;
    }
    .hud-restart:hover { filter: brightness(1.12); }
    .hud-notice { font-size: 12.5px; color: #9aa3c0; min-height: 32px; line-height: 1.35; }
  </style>
</head>
<body>
  <div id="app">
    <div id="hud-root"></div>
    <div id="game-root"></div>
  </div>
  <script type="module" src="/out/app/App.js"></script>
</body>
</html>
