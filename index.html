<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#10160f">
  <title>Merge Tower Defense</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    /*
      "War Table" — a tactical map-table identity: brass instrument
      fittings, engraved-plate typography, contour-line texture. Chosen to
      match the real tower art (stone/timber keep silhouettes) added in
      public/towers/. This is a fixed single visual world (a war-room
      console, not a document), so it does not adapt to the viewer's
      light/dark preference.
    */
    :root {
      color-scheme: dark;
      --bg: #10160f;
      --panel: linear-gradient(180deg, #1c2721, #16201b);
      --panel-border: #3c4d40;
      --brass: #b08d4f;
      --brass-dim: #7c6538;
      --ink: #dfe6dc;
      --ink-dim: #8fa08e;
      --stat-bg: #141b16;
      --stat-border: #2c3a2a;
      --danger-bg: rgba(181, 69, 47, 0.18);
      --danger-border: #b5452f;
      --danger-ink: #e2a58f;
      --danger-glow: rgba(181, 69, 47, 0.4);
      --pine: #4f8c62;
      --pine-ink: #eaf3ec;
      --rust: #b8622f;
      --rust-ink: #fdf1e8;
      --steel: #4d7fa0;
      --steel-ink: #eaf4fb;
      --display-font: "Rockwell", "Rockwell Nova", "Bookman Old Style", Georgia, serif;
      --mono-font: "SF Mono", Consolas, "Courier New", monospace;
    }
    * { box-sizing: border-box; }
    /* App-like feel, not a document: no rubber-band bounce and no
       pull-to-refresh fighting the game's own drag/pointer handling once
       wrapped in Capacitor's WebView. Scrolling itself stays available (not
       forced off) as a safety net on short viewports — the board is a fixed
       size and can outgrow a small phone screen in portrait. */
    html, body {
      min-height: 100%;
      overscroll-behavior: none;
      touch-action: manipulation;
    }
    body {
      margin: 0;
      /* dvh accounts for mobile browser chrome show/hide; vh is the
         fallback for engines that don't support it yet. */
      height: 100vh;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse 900px 500px at 50% 0%, #172018, transparent),
        var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      /* No text-select/callout on long-press: this is a game board, not a
         document, and a native-feeling touch target shouldn't pop a
         selection/copy menu or magnifier. */
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    /* Side-by-side on wide viewports; an explicit column switch (not
       flex-wrap) on narrow ones, so the canvas row can reliably claim
       "whatever height is left after the HUD" via flex-grow on a single
       cross-axis line — flex-wrap gives each stacked item its own line and
       won't distribute leftover height the same way. */
    #app {
      display: flex;
      flex-direction: row;
      gap: 20px;
      align-items: flex-start;
      justify-content: center;
      width: 100%;
      height: 100%;
      padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
        max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
    }
    /* HUD (React) and game canvas (PixiJS) live in separate roots. The
       canvas root gets whatever space the HUD doesn't take and shrinks the
       (fixed-resolution) Pixi canvas to fit it, preserving aspect ratio —
       the board is a fixed size in game-logic pixels but must still fit a
       phone screen shorter than that in portrait. */
    #hud-root { width: 250px; flex-shrink: 0; }
    #game-root {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 0;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    @media (max-width: 720px) {
      #app { flex-direction: column; align-items: center; }
      #hud-root { width: 100%; max-width: 360px; flex-shrink: 0; }
      #game-root { width: 100%; }
    }
    #game-root canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      border-radius: 3px;
      border: 1px solid var(--panel-border);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
      touch-action: none;
    }
    .hud {
      position: relative;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 3px;
      padding: 18px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04), 0 10px 26px rgba(0, 0, 0, 0.5);
    }
    /* Brass corner brackets — the one recurring "instrument" motif. */
    .hud::before,
    .hud::after {
      content: "";
      position: absolute;
      width: 11px;
      height: 11px;
      top: 7px;
      border-top: 2px solid var(--brass);
    }
    .hud::before { left: 7px; border-left: 2px solid var(--brass); }
    .hud::after { right: 7px; border-right: 2px solid var(--brass); }
    .hud-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid var(--panel-border);
      padding-bottom: 12px;
    }
    .hud-title {
      font-family: var(--display-font);
      font-size: 15px;
      margin: 0;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--brass);
      text-wrap: balance;
      line-height: 1.3;
    }
    .hud-mute {
      appearance: none;
      border: 1px solid var(--brass-dim);
      border-radius: 2px;
      background: var(--stat-bg);
      color: var(--ink-dim);
      font-family: var(--mono-font);
      padding: 4px 7px;
      font-size: 10px;
      letter-spacing: 0.04em;
      cursor: pointer;
      white-space: nowrap;
      transition: border-color 120ms ease, color 120ms ease, transform 80ms ease;
    }
    .hud-mute:hover { border-color: var(--brass); color: var(--ink); }
    .hud-mute:active { transform: translateY(1px); }
    .hud-mute:focus-visible { outline: 2px solid var(--brass); outline-offset: 1px; }
    .hud-stats { display: flex; flex-direction: column; gap: 6px; }
    .hud-stat {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      background: var(--stat-bg);
      border: 1px solid var(--stat-border);
      border-radius: 2px;
      padding: 7px 10px;
      font-size: 13.5px;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.25);
    }
    /* Brass rivets, echoing the panel's own corner brackets at a smaller
       scale — the same "instrument fitting" motif applied to every plate. */
    .hud-stat::before,
    .hud-stat::after {
      content: "";
      position: absolute;
      top: 4px;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--brass-dim);
      opacity: 0.8;
    }
    .hud-stat::before { left: 5px; }
    .hud-stat::after { right: 5px; }
    .hud-stat-label {
      color: var(--ink-dim);
      font-size: 10.5px;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }
    .hud-stat-value {
      font-family: var(--mono-font);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--ink);
    }
    .hud-stat-danger {
      background: var(--danger-bg);
      border-color: var(--danger-border);
      animation: hud-pulse 1.1s ease-in-out infinite;
    }
    .hud-stat-danger .hud-stat-label,
    .hud-stat-danger .hud-stat-value { color: var(--danger-ink); }
    @keyframes hud-pulse {
      0%, 100% { box-shadow: 0 0 0 0 var(--danger-glow); }
      50% { box-shadow: 0 0 8px 1px var(--danger-glow); }
    }
    @media (prefers-reduced-motion: reduce) {
      .hud-stat-danger { animation: none; }
    }
    .hud-shop { display: flex; flex-direction: column; gap: 7px; }
    .hud-buy {
      appearance: none;
      display: flex;
      align-items: center;
      gap: 9px;
      border: 1px solid var(--panel-border);
      border-radius: 2px;
      padding: 9px 12px;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      transition: filter 120ms ease, border-color 120ms ease, transform 80ms ease;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), inset 0 -3px 4px rgba(0, 0, 0, 0.16);
    }
    .hud-buy-label { flex: 1 1 auto; text-align: left; }
    /* Keep the currency suffix as lowercase "g" — the button's own
       uppercase transform would otherwise turn "28g" into "28G". */
    .hud-buy-cost { font-family: var(--mono-font); font-weight: 600; text-transform: none; }
    /* A tiny per-type glyph — the same shape language the board itself once
       used before real tower art (circle/square/diamond), now a quick-scan
       icon instead of a redundant colour swatch. */
    .hud-buy-glyph {
      width: 11px;
      height: 11px;
      flex-shrink: 0;
      background: currentColor;
      opacity: 0.92;
    }
    .hud-buy-archer { background: var(--pine); color: var(--pine-ink); }
    .hud-buy-cannon { background: var(--rust); color: var(--rust-ink); }
    .hud-buy-frost  { background: var(--steel); color: var(--steel-ink); }
    .hud-buy-archer .hud-buy-glyph { border-radius: 50%; }
    .hud-buy-cannon .hud-buy-glyph { border-radius: 3px; }
    .hud-buy-frost  .hud-buy-glyph { border-radius: 2px; transform: rotate(45deg); }
    .hud-buy:hover:not(:disabled) { filter: brightness(1.14); border-color: var(--brass); }
    .hud-buy:active:not(:disabled) {
      transform: translateY(1px);
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.35);
    }
    .hud-buy:focus-visible { outline: 2px solid var(--brass); outline-offset: 1px; }
    .hud-buy:disabled { background: var(--stat-bg); color: var(--ink-dim); border-color: var(--stat-border); cursor: not-allowed; }
    .hud-buy:disabled .hud-buy-glyph { opacity: 0.5; }
    .hud-gameover {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      border-radius: 2px;
      padding: 12px;
      font-size: 12.5px;
      color: var(--danger-ink);
    }
    .hud-restart {
      appearance: none;
      border: 1px solid var(--danger-border);
      border-radius: 2px;
      padding: 8px 12px;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--rust-ink);
      background: var(--rust);
      cursor: pointer;
      transition: filter 120ms ease, transform 80ms ease;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), inset 0 -3px 4px rgba(0, 0, 0, 0.16);
    }
    .hud-restart:hover { filter: brightness(1.14); }
    .hud-restart:active { transform: translateY(1px); box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.35); }
    .hud-restart:focus-visible { outline: 2px solid var(--brass); outline-offset: 1px; }
    .hud-notice {
      font-size: 12px;
      color: var(--ink-dim);
      min-height: 32px;
      line-height: 1.45;
      border-top: 1px solid var(--panel-border);
      padding-top: 10px;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="hud-root"></div>
    <div id="game-root"></div>
  </div>
  <script type="module" src="/out/app/App.js"></script>
</body>
</html>
